# This workflow must stay inside this repository. GitHub only discovers workflows under a
# repository root, and extension is its own repository: a workflow held in the parent working
# directory is tracked by nothing and never runs.
name: Release gates

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Build facts are byte-level release evidence. Keep Git from rewriting LF
    # source files to CRLF on Windows before those bytes are measured.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from the lockfile only
        run: npm ci

      - name: Refuse an unclean checkout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checkout was dirty before any gate ran:"
            git status --porcelain
            exit 1
          fi

      - name: Lockfile
        run: npm run check:lockfile

      - name: Types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: No telemetry
        run: npm run check:no-telemetry

      # BACHATA_TEST_FILE_TIMEOUT_MS bounds a whole file, not one case: the test runner isolates
      # each file in its own process and represents it as a test, so a file that outlasts this is
      # cancelled and every case behind it is reported as cancelledByParent and never runs. Windows
      # therefore keeps the hour it has always had, because its process-heavy files are far slower
      # than the same files elsewhere. Cutting it to the Linux bound cancelled whole files.
      #
      # What stops a hang from running for hours is the lane cap, not the file bound. The unit lane
      # opens one process scope for all files now rather than one per file, so this cap is what the
      # four hour Windows job actually needed.
      - name: Tests
        env:
          BACHATA_TEST_FILE_TIMEOUT_MS: ${{ runner.os == 'Windows' && '3600000' || '600000' }}
          BACHATA_TEST_RUN_TIMEOUT_MS: "5400000"
        run: npm test

      - name: Coverage gates
        env:
          BACHATA_COMMAND_TIMEOUT_MS: ${{ runner.os == 'Windows' && '1200000' || '' }}
        run: npm run test:coverage

      # The pinned Bridge archive is produced by the browser-bridge repository, so artifact
      # binding and release verification are not run here. They belong to a release job that
      # can fetch that archive; claiming them from this checkout would assert evidence this
      # workflow does not hold.
      - name: Release metadata identity
        run: npm run check:release-metadata:identity

      - name: Refuse source drift from the gates
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "A gate modified tracked source:"
            git status --porcelain
            exit 1
          fi
