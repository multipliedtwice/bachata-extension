# This workflow must stay inside this repository. GitHub only discovers workflows under a
# repository root, and extension is its own repository: a workflow held in the parent working
# directory is tracked by nothing and never runs.
name: Release gates

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - windows-coverage-regression
          - windows-complete-coverage

permissions:
  contents: read

concurrency:
  group: extension-release-gates-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

jobs:
  validate:
    if: inputs.scope != 'windows-coverage-regression' && inputs.scope != 'windows-complete-coverage'
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from the lockfile only
        run: npm ci

      - name: Refuse an unclean checkout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checkout was dirty before any gate ran:"
            git status --porcelain
            exit 1
          fi

      - name: Lockfile
        run: npm run check:lockfile

      - name: Types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: No telemetry
        run: npm run check:no-telemetry

      - name: Native Windows process completion
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          npm run build:emit
          node --test --test-name-pattern="native (process|Windows) scopes" tests/terminationIntegrity.test.cjs

      - name: Windows VS Code process host
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vscode-1.136.1.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'vscode-1.136.1'
          Invoke-WebRequest -Uri 'https://vscode.download.prss.microsoft.com/dbazure/download/stable/a44adf7f53e00964ab890f9f8758a334f1fc15bc/VSCode-win32-x64-1.136.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'deca16ea5c4d71ece23e50af57632bba3abd0e3577c3c8bfbcdd90b03f11e402') {
            throw 'VS Code download digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $stdout = Join-Path $env:RUNNER_TEMP 'vscode-process-tests.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'vscode-process-tests.stderr'
          $hostProcess = Start-Process -FilePath (Join-Path $directory 'Code.exe') -ArgumentList '--test', '--test-name-pattern=native', 'tests/terminationIntegrity.test.cjs', 'tests/commandInvocation.test.cjs', 'tests/managedProjectChecks.test.cjs', 'tests/gitHeadGuard.test.cjs', 'tests/managedHandoffHardening.test.cjs', 'tests/orchestrator.test.cjs' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          Get-Content $stderr
          if ($hostProcess.ExitCode -ne 0) { throw "VS Code process tests exited with $($hostProcess.ExitCode)" }

      - name: Native Windows release safety
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          node --test tests/adapters.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/process.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/managedHandoffHardening.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern="verification commands stop|orchestration checks do not inherit|sealing refuses.*symbolic link|sealed input identity|a sealed working-tree input starts|applying a sealed run refuses a target that no longer holds" tests/orchestrator.test.cjs

      - name: Native Windows file and fixture safety
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node --test --test-concurrency=1 tests/codexProtocol.test.cjs tests/publishFindings.test.cjs tests/releaseBinding.test.cjs tests/scratchSafety.test.cjs tests/storage.test.cjs tests/timeoutBounds.test.cjs tests/vsixVerification.test.cjs tests/workspaceMutationFence.test.cjs tests/worktreeLock.test.cjs

      - name: Tests
        env:
          BACHATA_TEST_FILE_TIMEOUT_MS: ${{ runner.os == 'Windows' && '3600000' || '600000' }}
        run: npm test

      - name: Coverage gates
        env:
          BACHATA_COMMAND_TIMEOUT_MS: ${{ runner.os == 'Windows' && '7200000' || '' }}
        run: npm run test:coverage

      # The pinned Bridge archive is produced by the browser-bridge repository, so artifact
      # binding and release verification are not run here. They belong to a release job that
      # can fetch that archive; claiming them from this checkout would assert evidence this
      # workflow does not hold.
      - name: Release metadata identity
        run: npm run check:release-metadata:identity

      - name: Refuse source drift from the gates
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "A gate modified tracked source:"
            git status --porcelain
            exit 1
          fi

  windows-coverage-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-coverage-regression'
    name: Windows retained-run coverage regression
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and build
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:emit
      - name: Validate focused run source and evidence
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:build-facts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/bridgeRunValidation.test.cjs tests/documentation.test.cjs tests/buildFacts.test.cjs tests/releaseMetadata.test.cjs
      - name: Concurrent feature-delivery and orchestrator coverage
        timeout-minutes: 50
        run: >-
          node --experimental-test-coverage --test-concurrency=2
          --test-coverage-exclude=tests/**
          --test-coverage-exclude=scripts/**
          --test-coverage-exclude=dist/runtime/createRuntime.js
          --test-coverage-exclude=dist/webview.js
          --test-coverage-exclude=dist/webview-behavior.js
          --test tests/orchestratedFeatureDelivery.test.cjs tests/orchestrator.test.cjs

  windows-complete-coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-complete-coverage'
    name: Windows complete coverage gates
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from the lockfile only
        run: npm ci
      - name: Refuse an unclean checkout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checkout was dirty before any gate ran:"
            git status --porcelain
            exit 1
          fi
      - name: Lockfile
        run: npm run check:lockfile
      - name: Types
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: No telemetry
        run: npm run check:no-telemetry
      - name: Build source and validate evidence
        run: |
          npm run build:emit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:build-facts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/bridgeRunValidation.test.cjs tests/documentation.test.cjs tests/buildFacts.test.cjs tests/releaseMetadata.test.cjs
      - name: Native verification sequencing and timeout coverage
        timeout-minutes: 5
        run: >-
          node --experimental-test-coverage --test
          --test-name-pattern="^(native verification commands stop at the first deterministic failure|command runner terminates timed-out checks)$"
          tests/orchestrator.test.cjs
      - name: Coverage gates
        env:
          BACHATA_COMMAND_TIMEOUT_MS: "7200000"
        run: npm run test:coverage
      - name: Release metadata identity
        run: npm run check:release-metadata:identity
      - name: Refuse source drift from the gates
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "A gate modified tracked source:"
            git status --porcelain
            exit 1
          fi
